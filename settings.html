<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Settings</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preload" href="/fonts/almarai-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/almarai-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/almarai-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/red-rose.woff2" as="font" type="font/woff2" crossorigin />
</head>

<body class="page">
  <main class="settings">
    <h1 class="settings__title">Settings</h1>

    <div class="settings__body">
      <form id="settings-form" class="settings__form">
        <fieldset class="option">
          <legend class="option__title">
            <span class="option__icon option__icon--theme" aria-hidden="true"></span>Game themes
          </legend>
          <label class="option__row">
            <input class="option__input" type="radio" name="theme" value="code-vibes" />
            <span class="option__label">Code vibes theme</span>
          </label>
          <label class="option__row">
            <input class="option__input" type="radio" name="theme" value="gaming" />
            <span class="option__label">Gaming theme</span>
          </label>
        </fieldset>

        <fieldset class="option">
          <legend class="option__title">
            <span class="option__icon option__icon--player" aria-hidden="true"></span>Choose player
          </legend>
          <label class="option__row">
            <input class="option__input" type="radio" name="player" value="blue" />
            <span class="option__label">Blue</span>
          </label>
          <label class="option__row">
            <input class="option__input" type="radio" name="player" value="orange" />
            <span class="option__label">Orange</span>
          </label>
        </fieldset>

        <fieldset class="option">
          <legend class="option__title">
            <span class="option__icon option__icon--size" aria-hidden="true"></span>Board size
          </legend>
          <label class="option__row">
            <input class="option__input" type="radio" name="size" value="16" />
            <span class="option__label">16 cards</span>
          </label>
          <label class="option__row">
            <input class="option__input" type="radio" name="size" value="24" />
            <span class="option__label">24 cards</span>
          </label>
          <label class="option__row">
            <input class="option__input" type="radio" name="size" value="36" />
            <span class="option__label">36 cards</span>
          </label>
        </fieldset>
      </form>

      <div class="settings__side">
        <img id="preview" class="preview" src="" alt="Preview of the selected theme" />

        <div class="summary">
          <span class="summary__item" id="summary-theme">Game theme</span>
          <span class="summary__item" id="summary-player">Player</span>
          <span class="summary__item" id="summary-size">Board size</span>
          <button id="start" class="button button--small" type="button" disabled>
            <span class="button__icon button__icon--play" aria-hidden="true"></span>
            <span class="button__label">Start</span>
          </button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/src/settings.ts"></script>
</body>

</html>
